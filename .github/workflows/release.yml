name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Parse version from tag (v1.2.3 → major=1 minor=2 patch=3)
      # versionCode = yyyyMMddHH timestamp (fits 32-bit signed int until ~2100)
      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          VERSION_BUILD=$(date -u +"%Y%m%d%H")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "version_build=$VERSION_BUILD" >> "$GITHUB_OUTPUT"

      # Keep version.properties in sync with the tag
      - name: Update version.properties
        run: |
          cat > version.properties <<EOF
          VERSION_MAJOR=${{ steps.version.outputs.major }}
          VERSION_MINOR=${{ steps.version.outputs.minor }}
          VERSION_PATCH=${{ steps.version.outputs.patch }}
          VERSION_BUILD=${{ steps.version.outputs.version_build }}
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode keystore from base64 secret
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build release AAB
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK (for GitHub Release attachment)
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Draft release — you publish manually and fill in release notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.version.outputs.tag }}"
          draft: true
          prerelease: false
          files: app/build/outputs/apk/release/*.apk

      # Upload AAB to Play Store internal testing track
      # To promote: use Play Console to promote from internal manually
      - name: Upload to Play Store (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tomasps.slurmmanag
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
