name: Bug Report
description: Report a crash, incorrect behavior, or broken feature
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe what went wrong…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this reliably?
      placeholder: |
        1. Go to …
        2. Tap …
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SSH / Connection
        - Job list / Dashboard
        - Job detail
        - Job submission
        - Notifications / Alerts
        - Server management
        - Settings
        - Navigation / UI
        - Other
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "e.g. v1.2.0 (build 42)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste any relevant logcat output here.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, device model, cluster Slurm version, etc.
